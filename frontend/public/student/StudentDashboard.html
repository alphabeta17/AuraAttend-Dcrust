<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard - AuraAttend</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --sb-bg: #ffffff;
      --sb-border: #e6e3ee;
      --sb-purple: #4a1d7a;
      --sb-purple-dark: #3b1566;
      --sb-text: #2b2b36;
      --sb-hover-bg: #f5f3fa;
      --sb-width: 240px;
      --card: #ffffff;
      --purple: #7c3aed;
    }

    * { box-sizing: border-box; }

    body { 
      margin: 0;
      font-family: "Poppins", "Roboto", "Segoe UI", system-ui, sans-serif;
      background: #f6f5fa;
      color: var(--sb-text);
    }

    /* Noodle Throbber Overlay */
    #loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--card);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .noodle-loader {
      font-size: 50px;
      animation: bounceSpin 1.2s infinite ease-in-out;
    }
    .loader-text {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--purple);
    }
    @keyframes bounceSpin {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(15deg); }
    }
    body.loaded #loader-overlay {
      opacity: 0;
      visibility: hidden;
    }

    .layout { display: flex; min-height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      width: var(--sb-width);
      height: 100vh;
      background: var(--sb-bg);
      border-right: 1px solid var(--sb-border);
      flex-shrink: 0;
    }

    .sb-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 28px 16px 26px;
    }
    .sb-logo-icon { width: 42px; height: 32px; color: var(--sb-purple-dark); }
    .sb-logo-text { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }

    .sb-nav { flex: 1; overflow-y: auto; }
    .sb-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ===== Menu item ===== */
    .sb-item {
      --c: #4a1d7a;
      --c-bg: #ece8f4;

      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: calc(100% - 24px);
      margin: 0 12px;
      padding: 8px 12px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--sb-text);
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .sb-item:hover { background: var(--sb-hover-bg); }

    /* ===== Colored icon badge ===== */
    .sb-icon-wrap {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--c-bg);
      color: var(--c);
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .sb-icon { width: 20px; height: 20px; }
    .sb-label { white-space: nowrap; }

    .sb-item:hover .sb-icon-wrap { transform: scale(1.08); }

    /* ===== Active state ===== */
    .sb-item.active { background: var(--c-bg); font-weight: 500; }
    .sb-item.active .sb-icon-wrap {
      background: var(--c);
      color: #ffffff;
      box-shadow: 0 4px 10px -2px var(--c);
    }
    .sb-item.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--c);
    }

    /* ===== Colors for each option ===== */
    .c-student    { --c: #7c3aed; --c-bg: #f1eaff; }
    .c-attendance { --c: #4a1d7a; --c-bg: #ece8f4; }
    .c-schedule   { --c: #0284c7; --c-bg: #e0f2fe; }
    .c-grades     { --c: #d97706; --c-bg: #fef3c7; }
    .c-library    { --c: #059669; --c-bg: #d1fae5; }

    /* ===== Main area ===== */
    .main { flex: 1; padding: 28px 32px; }
    .main h1 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }

    @media (max-width: 768px) {
      .sidebar { width: 76px; }
      .sb-logo-text, .sb-label { display: none; }
      .sb-item { justify-content: center; padding: 8px 0; }
    }
  </style>
</head>

<body>
  <!-- Noodle Throbber Overlay -->
  <div id="loader-overlay">
    <div class="noodle-loader">🍜</div>
    <div class="loader-text">Slurping up attendance data...</div>
  </div>

  <div class="layout">
    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="sb-logo">
        <svg class="sb-logo-icon" viewBox="0 0 48 36" aria-hidden="true">
          <path d="M24 2L1 13l23 11 23-11L24 2z" fill="currentColor" />
          <path d="M10 19v8c0 3 6.5 7 14 7s14-4 14-7v-8l-14 6.5L10 19z" fill="currentColor" />
          <path d="M44 14v12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        </svg>
        <span class="sb-logo-text">AuraAttend</span>
      </div>

      <nav class="sb-nav" aria-label="Main navigation">
        <ul class="sb-list" id="menu">
          <li>
            <a class="sb-item c-student" href="Profile.html">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
              </span>
              <span class="sb-label">Student Profile</span>
            </a>
          </li>
          <li>
            <a class="sb-item c-attendance active" href="Attendence.html">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                  <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                  <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                  <rect x="3" y="16" width="7" height="5" rx="1.5"/>
                </svg>
              </span>
              <span class="sb-label">Attendance</span>
            </a>
          </li>
          <li>
            <button class="sb-item c-schedule" data-id="schedule">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
              </span>
              <span class="sb-label">Schedule</span>
            </button>
          </li>
          <li>
            <button class="sb-item c-grades" data-id="grades">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h6"/></svg>
              </span>
              <span class="sb-label">Grades</span>
            </button>
          </li>
          <li>
            <button class="sb-item c-library" data-id="library">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v14"/></svg>
              </span>
              <span class="sb-label">Library</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main">
      <h1>Welcome to Student Dashboard</h1>
      <p>Your attendance and academic records will appear here.</p>
    </main>
  </div>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.body.classList.add("loaded");
      }, 600);
    });
  </script>
</body>
</html>
