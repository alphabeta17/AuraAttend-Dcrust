<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance - AuraAttend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #4a1d7a;
      --purple-dark: #3b1566;
      --purple-tint: #ece8f4;
      --purple-soft: #f5f3fa;
      --bg: #f6f5fa;
      --card: #ffffff;
      --border: #e6e3ee;
      --text: #2b2b36;
      --muted: #6b6878;
      --sb-width: 240px;

      /* Attendance Card Vars */
      --violet-900: #2a1252;
      --violet-800: #3d1f73;
      --violet-700: #5b21b6;
      --violet-600: #7c3aed;
      --violet-100: #f1eafd;
      --pink-500: #d946b8;
      --ring-track: #ece6fa;
      --gradient: linear-gradient(135deg, #7c3aed 0%, #d946b8 100%);
      --shadow-card: 0 4px 16px rgba(110, 60, 190, 0.08);
      --shadow-chip: 0 2px 8px rgba(110, 60, 190, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', "Roboto", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #loader-overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: var(--card);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .noodle-loader { font-size: 50px; animation: bounceSpin 1.2s infinite ease-in-out; }
    .loader-text { margin-top: 14px; font-size: 15px; font-weight: 500; color: var(--purple); }
    @keyframes bounceSpin {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(15deg); }
    }
    body.loaded #loader-overlay { opacity: 0; visibility: hidden; }
    
    .layout { display: flex; min-height: 100vh; }

    /* ================= SIDEBAR ================= */
    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      width: var(--sb-width);
      height: 100vh;
      background: var(--card);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sb-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 16px 26px; }
    .sb-logo-icon { width: 42px; height: 32px; color: var(--purple-dark); }
    .sb-logo-text { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }

    .sb-nav { flex: 1; overflow-y: auto; }
    .sb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

    .sb-item {
      --c: #4a1d7a;
      --c-bg: #ece8f4;
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: calc(100% - 24px);
      margin: 0 12px;
      padding: 8px 12px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .sb-item:hover { background: var(--purple-soft); }
    .sb-item:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

    .sb-icon-wrap {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--c-bg);
      color: var(--c);
      flex-shrink: 0;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .sb-icon { width: 20px; height: 20px; }
    .sb-label { white-space: nowrap; }
    .sb-item:hover .sb-icon-wrap { transform: scale(1.08); }

    .sb-item.active { background: var(--c-bg); font-weight: 500; }
    .sb-item.active .sb-icon-wrap { background: var(--c); color: #fff; box-shadow: 0 4px 10px -2px var(--c); }
    .sb-item.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--c);
    }

    .c-student    { --c: #7c3aed; --c-bg: #f1eaff; }
    .c-attendance { --c: #4a1d7a; --c-bg: #ece8f4; }
    .c-schedule   { --c: #0284c7; --c-bg: #e0f2fe; }
    .c-grades     { --c: #d97706; --c-bg: #fef3c7; }
    .c-library    { --c: #059669; --c-bg: #d1fae5; }
    .c-map        { --c: #e11d48; --c-bg: #ffe4e9; }
    .c-profile    { --c: #db2777; --c-bg: #fce7f3; }
    .c-logout     { --c: #475569; --c-bg: #e8ecf1; }

    .sb-footer { padding: 16px 0 28px; }

    /* ================= MAIN ================= */
    .main { flex: 1; min-width: 0; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 32px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { margin: 0; font-size: 24px; font-weight: 500; flex: 1; }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 260px;
      padding: 9px 14px;
      background: var(--purple-tint);
      border-radius: 10px;
      color: var(--muted);
    }
    .search input { border: none; background: transparent; outline: none; font: inherit; width: 100%; color: var(--text); }
    .search svg { width: 18px; height: 18px; flex-shrink: 0; }

    .bell { position: relative; display: grid; place-items: center; width: 38px; height: 38px; color: var(--purple); }
    .bell svg { width: 22px; height: 22px; }
    .bell .count {
      position: absolute; top: 2px; right: 2px;
      background: var(--purple); color: #fff;
      font-size: 10px; font-weight: 500;
      width: 16px; height: 16px; border-radius: 50%;
      display: grid; place-items: center;
    }

    .user { display: flex; align-items: center; gap: 10px; }
    .user .mini-avatar { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: var(--purple-tint); flex-shrink: 0; }
    .user-name { font-size: 14px; font-weight: 500; margin: 0; line-height: 1.2; }
    .user-id { font-size: 12px; color: var(--muted); margin: 0; }

    /* ================= ATTENDANCE CONTENT ================= */
    .content {
      padding: 24px 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .banner {
      position: relative;
      overflow: hidden;
      padding: 28px 32px;
      border-radius: 20px;
      background: linear-gradient(180deg, var(--violet-800) 0%, var(--violet-900) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .app-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b3fe0 0%, #c04fd6 100%);
      box-shadow: 0 8px 20px rgba(160, 70, 220, 0.4);
      flex: none;
    }

    .banner-text h2 { margin: 0; font-size: 22px; font-weight: 800; }
    .banner-text p { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }

    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .content-head h2 { margin: 0; font-size: 22px; font-weight: 700; }
    @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.rotating {
    animation: spin 0.8s linear infinite;
}

    .chips { display: flex; gap: 10px; }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-chip);
    }
    .chip span { font-size: 12px; font-weight: 600; color: var(--muted); }
    .chip strong { font-size: 15px; font-weight: 800; color: var(--violet-700); }

    /* ---------- Subjects ---------- */
    .subjects { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }

    .subject {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 22px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    .ring-wrap { position: relative; flex: none; width: 68px; height: 68px; }
    .ring {
      --p: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(from 0deg, var(--violet-600), var(--pink-500) calc(var(--p) * 1%), var(--ring-track) calc(var(--p) * 1%));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
    }
    .ring-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--violet-900);
    }

    .subject-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .subject-name { font-size: 18px; font-weight: 700; }
    .subject-count { font-size: 12px; font-weight: 600; color: var(--violet-700); letter-spacing: 0.03em; }

    .btn-summary {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--violet-700);
      background: var(--violet-100);
      border: 0;
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-summary:hover { background: var(--gradient); color: #fff; }

    /* ================= RESPONSIVE ================= */

@media (max-width: 768px) {

  .subject { padding: 14px !important; gap: 14px !important; flex-wrap: wrap !important; }
  .btn-summary { width: 100% !important; text-align: center !important; }
}
    
  </style>

<script>
// 1. Page load hone par cache check karein
window.addEventListener("load", () => {
    const cachedData = localStorage.getItem('latestAttendanceData');
    if (cachedData) {
        try {
            const parsedData = JSON.parse(cachedData);
            renderAttendanceList(parsedData);
            setTimeout(() => { document.body.classList.add("loaded"); }, 200);
            console.log("Loaded attendance from local cache.");
            return; 
        } catch (e) {
            console.error("Error parsing cached data:", e);
        }
    }
    fetchAttendanceData();
});

// 2. Sync / Refresh button click hone par chalne wala function
function refreshAttendance() {
    // Purana cached data hata dein
    localStorage.removeItem('latestAttendanceData'); 
    
    // Button ke icon ko rotating class de dein taaki woh ghumne lage
    const syncIcon = document.getElementById('syncIcon');
    if (syncIcon) {
        syncIcon.classList.add('rotating');
    }
    
    // Server se fresh attendance data fetch karein
    fetchAttendanceData(); 
}

// 3. Backend se real attendance mangwane wala single function
async function fetchAttendanceData() {
    const loggedInEmail = localStorage.getItem("userEmail");
    if (!loggedInEmail) {
        window.location.href = 'login.html';
        return;
    }

    const syncIcon = document.getElementById('syncIcon');

    try {
        const response = await fetch('/api/auth/fetch-university-attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loggedInEmail })
        });
        
        const result = await response.json();

        if (result.success) {
            // Local storage mein data save karein
            localStorage.setItem('latestAttendanceData', JSON.stringify(result.data));
            // Screen par render karein
            renderAttendanceList(result.data);
            setTimeout(() => { document.body.classList.add("loaded"); }, 400);
        } else {
            alert(result.message || "Failed to load attendance.");
            document.body.classList.add("loaded");
        }
    } catch (error) {
        console.error("Error fetching attendance:", error);
        alert("Network error while syncing attendance.");
        document.body.classList.add("loaded");
    } finally {
        // Data aate hi ya error aate hi icon ki rotation rok dein
        if (syncIcon) {
            syncIcon.classList.remove('rotating');
        }
    }
}

// 4. Subject codes aur unke friendly names ki mapping
const subjectMapping = {
    "ESECE201D": "Digital System Design",
    "PCCSE201D": "Data Structures",
    "PCCSE203D": "OOPs using JAVA",
    "PCCSE205D": "Database Management",
    "PCCSE207D": "Computer Architecture",
    "COI ": "Constitution of India",
    "COI": "Constitution of India"
};

// 5. UI mein subjects draw karne wala function
function renderAttendanceList(attendanceArray) {
    const subjectsContainer = document.querySelector('.subjects');
    subjectsContainer.innerHTML = ''; 

    if (attendanceArray.length === 0) {
        subjectsContainer.innerHTML = '<p style="text-align:center; padding:20px;">No classes found.</p>';
        return;
    }

    attendanceArray.forEach(item => {
        const percValue = parseFloat(item.percentage) || 0;
        let formattedSummary = item.summary;
        const totalMatch = item.summary.match(/Total Classes Taken: (\d+)/);
        const presentMatch = item.summary.match(/Present Count: (\d+)/);
        
        if (totalMatch && presentMatch) {
            formattedSummary = `${presentMatch[1]} OUT OF ${totalMatch[1]}`;
        }

        const cleanSubjectCode = item.subject.trim(); 
        const friendlyName = subjectMapping[cleanSubjectCode] || item.subject;
        const encodedSubject = encodeURIComponent(item.subject);

        const li = document.createElement('li');
        li.className = 'subject';
        li.innerHTML = `
            <div class="ring-wrap">
                <div class="ring" style="--p: ${percValue}"></div>
                <div class="ring-label">${item.percentage}%</div>
            </div>
            <div class="subject-info">
                <div class="subject-name">${friendlyName}</div>
                <div class="subject-count">${formattedSummary}</div>
            </div>
            <button class="btn-summary" type="button" onclick="window.location.href='Summary.html?subject=${encodedSubject}'">Summary</button>
        `;
        subjectsContainer.appendChild(li);
    });
}
</script>
</body>
</html>
