<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --sb-bg: #ffffff;
      --sb-border: #e6e3ee;
      --sb-purple: #4a1d7a;
      --sb-purple-dark: #3b1566;
      --sb-text: #2b2b36;
      --sb-hover-bg: #f5f3fa;
      --sb-width: 240px;
    }

    * { box-sizing: border-box; }

    body { 
      margin: 0;
      font-family: "Poppins", "Roboto", "Segoe UI", system-ui, sans-serif;
      background: #f6f5fa;
      color: var(--sb-text);
    }

    .layout { display: flex; min-height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      width: var(--sb-width);
      height: 100vh;
      background: var(--sb-bg);
      border-right: 1px solid var(--sb-border);
      flex-shrink: 0;
    }

    .sb-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 28px 16px 26px;
    }
    .sb-logo-icon { width: 42px; height: 32px; color: var(--sb-purple-dark); }
    .sb-logo-text { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }

    .sb-nav { flex: 1; overflow-y: auto; }
    .sb-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ===== Menu item ===== */
    .sb-item {
      /* per-item colors (overridden by the color classes below) */
      --c: #4a1d7a;
      --c-bg: #ece8f4;

      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: calc(100% - 24px);
      margin: 0 12px;
      padding: 8px 12px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--sb-text);
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .sb-item:hover { background: var(--sb-hover-bg); }
    .sb-item:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

    /* ===== Colored icon badge ===== */
    .sb-icon-wrap {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--c-bg);
      color: var(--c);
      flex-shrink: 0;
      transition: background 0.2s ease, color 0.2s ease,
                  transform 0.2s ease, box-shadow 0.2s ease;
    }
    .sb-icon { width: 20px; height: 20px; }
    .sb-label { white-space: nowrap; }

    .sb-item:hover .sb-icon-wrap { transform: scale(1.08); }

    /* ===== Active state ===== */
    .sb-item.active { background: var(--c-bg); font-weight: 500; }
    .sb-item.active .sb-icon-wrap {
      background: var(--c);
      color: #ffffff;
      box-shadow: 0 4px 10px -2px var(--c);
    }
    .sb-item.active::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 4px;
      bottom: 4px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--c);
    }

    /* ===== Colors for each option ===== */
    .c-student    { --c: #7c3aed; --c-bg: #f1eaff; }  /* violet */
    .c-attendance { --c: #4a1d7a; --c-bg: #ece8f4; }  /* brand purple */
    .c-schedule   { --c: #0284c7; --c-bg: #e0f2fe; }  /* blue */
    .c-grades     { --c: #d97706; --c-bg: #fef3c7; }  /* amber */
    .c-library    { --c: #059669; --c-bg: #d1fae5; }  /* green */
    .c-map        { --c: #e11d48; --c-bg: #ffe4e9; }  /* red */
    .c-profile    { --c: #db2777; --c-bg: #fce7f3; }  /* pink */
    .c-logout     { --c: #475569; --c-bg: #e8ecf1; }  /* slate */

    .sb-footer { padding: 16px 0 28px; }

    /* ===== Main area (placeholder) ===== */
    .main { flex: 1; padding: 28px 32px; }
    .main h1 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }

    @media (max-width: 768px) {
      .sidebar { width: 76px; }
      .sb-logo-text, .sb-label { display: none; }
      .sb-item { justify-content: center; padding: 8px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sb-item, .sb-icon-wrap { transition: none; }
    }
  </style>
</head>

<body>
  <div class="layout">

    <!-- ===== LEFT SIDEBAR ===== -->

        </svg>
        <span class="sb-logo-text">AuraAttend</span>

              <span class="sb-label">Schedule</span>
            </button>
          </li>

          <li>
            <button class="sb-item c-grades" data-id="grades" data-title="Grades">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h6"/></svg>
              </span>
              <span class="sb-label">Grades</span>
            </button>
          </li>

          <li>
            <button class="sb-item c-library" data-id="library" data-title="Library">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v14"/></svg>
              </span>
              <span class="sb-label">Library</span>
            </button>
          </li>

          <li>
            <button class="sb-item c-map" data-id="campus-map" data-title="Campus Map">
              <span class="sb-icon-wrap">
                <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12
